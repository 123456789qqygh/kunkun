<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>私人陪伴系统</title>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="陪伴">
    <style>
        /* 正在输入动画 */
        @keyframes typing {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }
        .msg-ai.typing {
            animation: typing 1.5s infinite;
            color: #999;
        }
        
        body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif; background-color: #FFFFFF; user-select: none; overflow: hidden; }
        .container { display: flex; flex-direction: column; align-items: center; height: 100vh; height: 100dvh; background-color: #FFFFFF; position: relative; transition: background 0.8s ease; overflow: hidden; padding-top: env(safe-area-inset-top); }
        iframe[title="netlify"], #netlify-badge, body > div[style*="z-index: 999999"] { display: none !important; }
        .status-bar { margin-top: 10px; display: flex; gap: 10px; align-items: center; z-index: 10; }
        .stat-item { font-size: 14px; font-weight: bold; color: #FF69B4; background: #FFF0F5; padding: 5px 12px; border-radius: 15px; border: 1px solid #FFE4E1; }
        .stat-item:last-child { color: #F59A23; }
        .level-tag { background: #FF69B4; color: #fff; border: none; font-size: 12px; }
        .top-tools { display: flex; justify-content: center; gap: 5px; margin-top: 10px; z-index: 10; }
        .tool-btn { background: #F8F9FA; padding: 5px 10px; border-radius: 15px; font-size: 12px; color: #555; font-weight: bold; border: 1px solid #EEE; cursor: pointer; transition: all 0.1s; }
        .tool-btn:active { transform: scale(0.95); background: #FFE4E1; color: #FF69B4; }
        .character-area { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; width: 100%; z-index: 5; padding-bottom: 10px; }
        .bubble { position: absolute; top: 5%; background: #fff; color: #333; padding: 8px 16px; border-radius: 15px; font-size: 14px; font-weight: bold; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1); border: 1px solid #eee; z-index: 20; display: none; text-align: center; max-width: 80%; line-height: 1.4; }
        .bubble::after { content: ''; position: absolute; bottom: -6px; left: 50%; margin-left: -6px; border-width: 6px 6px 0; border-style: solid; border-color: #ffffff transparent transparent transparent; }
        .char-box { position: relative; width: 250px; height: 250px; display: flex; justify-content: center; align-items: center; }
        .halo-bg { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 225px; height: 225px; background: radial-gradient(circle, rgba(255, 255, 255, 0.9) 0%, rgba(255, 255, 255, 0.1) 60%, transparent 80%); border-radius: 50%; z-index: 0; pointer-events: none; animation: breathe 4s ease-in-out infinite; }
        .char-img { position: relative; z-index: 1; width: 100%; height: 100%; object-fit: contain; cursor: pointer; animation: floatChar 3s ease-in-out infinite alternate; transition: filter 0.5s, transform 0.2s; transform: scale(1.05); }
        .char-img:active { transform: scale(0.95); }
        .shake-animation { animation: shake 0.4s ease-in-out; }
        @keyframes shake { 0% { transform: translate(1px, 1px) rotate(0deg) scale(1.05); } 20% { transform: translate(-3px, 0px) rotate(3deg) scale(1.05); } 40% { transform: translate(3px, -1px) rotate(-3deg) scale(1.05); } 60% { transform: translate(-3px, 2px) rotate(2deg) scale(1.05); } 80% { transform: translate(3px, 1px) rotate(-1deg) scale(1.05); } 100% { transform: translate(1px, 1px) rotate(0deg) scale(1.05); } }
        .acc { position: absolute; font-size: 40px; z-index: 2; pointer-events: none; text-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .acc-head { top: -10px; left: 50%; transform: translateX(-50%); }
        .acc-face { top: 40px; left: 50%; transform: translateX(-50%); font-size: 30px; }
        .acc-hand { bottom: 40px; left: 20px; font-size: 30px; transform: rotate(30deg); }
        .acc-back { top: 60px; left: 50%; transform: translateX(-50%); font-size: 80px; z-index: 0; opacity: 0.8; }
        @keyframes floatChar { 0% { transform: translateY(0) scale(1.05); } 100% { transform: translateY(-10px) scale(1.05); } }
        @keyframes breathe { 0% { transform: translate(-50%, -50%) scale(1); opacity: 0.8; } 50% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; } 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.8; } }
        .hitbox { position: absolute; background-color: rgba(0, 0, 0, 0.01); z-index: 999 !important; cursor: pointer; }
        .hit-head { top: 12%; left: 20%; width: 60%; height: 30%; } .hit-face { top: 30%; left: 35%; width: 30%; height: 20%; }
        .hit-belly { top: 55%; left: 30%; width: 40%; height: 20%; } .hit-foot { bottom: 10%; left: 30%; width: 40%; height: 20%; }
        .hit-tail { bottom: 30%; right: 5%; width: 25%; height: 25%; } .hit-ear { top: 2%; left: 20%; width: 60%; height: 15%; }
        .hit-hand { top: 65%; left: 15%; width: 70%; height: 20%; } .hit-neck { top: 42%; left: 40%; width: 20%; height: 10%; }
        .hit-nose { top: 32% !important; left: 45% !important; width: 10% !important; height: 10% !important; } .hit-cheek { top: 35% !important; left: 25% !important; width: 15% !important; height: 15% !important; }
        .switch-btn-new { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); background-color: #FF69B4; color: white; padding: 15px 6px; border-radius: 20px; font-size: 12px; font-weight: bold; writing-mode: vertical-lr; letter-spacing: 2px; z-index: 50; cursor: pointer; box-shadow: 0 2px 10px rgba(255,105,180,0.4); }
        .switch-btn-new:active { transform: translateY(-50%) scale(0.95); }
        .tip-text { position: absolute; bottom: 10px; color: #999; font-size: 14px; }
        .float-text { position: absolute; top: 40%; color: #FF69B4; font-size: 32px; font-weight: bold; pointer-events: none; animation: floatUp 0.8s ease-out forwards; z-index: 1000 !important; display: none; }
        @keyframes floatUp { 0% { opacity: 1; transform: translateY(0) scale(0.8); } 100% { opacity: 0; transform: translateY(-60px) scale(1.2); } }
        .chat-area { width: 90%; height: 140px; max-height: 25vh; padding: 8px; margin-bottom: 5px; box-sizing: border-box; z-index: 10; overflow-y: auto; display: flex; flex-direction: column; pointer-events: auto; }
        .chat-msg { padding: 6px 12px; border-radius: 15px; margin-bottom: 6px; font-size: 14px; max-width: 80%; word-wrap: break-word; line-height: 1.4; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .msg-user { background: #E6F2FF; color: #333; margin-left: auto; border-bottom-right-radius: 4px; }
        .msg-ai { background: #FFF0F5; color: #333; border: 1px solid #FFE4E1; border-bottom-left-radius: 4px; }
        .nav-bar { display: flex; gap: 15px; margin-bottom: 5px; z-index: 10; }
        .nav-item { display: flex; flex-direction: column; align-items: center; background: #FFF; padding: 5px 15px; border-radius: 15px; border: 1px solid #EEE; box-shadow: 0 2px 5px rgba(0,0,0,0.03); cursor: pointer; transition: all 0.1s; }
        .nav-item:active { transform: scale(0.95); }
        .nav-icon { font-size: 20px; } .nav-label { font-size: 10px; color: #666; margin-top: 2px; }
        .bottom-bar { width: 100%; padding: 10px 20px; display: flex; gap: 10px; align-items: center; box-sizing: border-box; padding-bottom: max(20px, env(safe-area-inset-bottom)); background: transparent; z-index: 10; }
        .real-input { flex: 1; background: #F8F9FA; padding: 10px 15px; border-radius: 20px; font-size: 14px; border: 1px solid #E0E0E0; outline: none; }
        .send-btn { background: #FF69B4; color: white; font-size: 14px; border-radius: 20px; padding: 0 20px; height: 40px; line-height: 40px; margin: 0; border: none; cursor: pointer; }
        .send-btn:active { transform: scale(0.95); }
        .modal-mask, .box-mask { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.5); display: flex; justify-content: center; align-items: center; z-index: 2000; padding: 20px 0; box-sizing: border-box; }
        .modal-content { width: 90%; max-height: 85vh; background: #FFF; border-radius: 20px; padding: 20px; display: flex; flex-direction: column; animation: popIn 0.3s ease-out; box-sizing: border-box; overflow-y: auto; }
        .modal-title { font-size: 18px; font-weight: bold; color: #333; margin-bottom: 15px; text-align: center;}
        .close-btn { margin-top: 15px; background: #333; color: white; padding: 8px 0; text-align: center; border-radius: 20px; font-size: 14px; flex-shrink: 0; cursor: pointer; width: 80%; margin-left: auto; margin-right: auto;}
        @keyframes popIn { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        .diary-tabs { display: flex; width: 100%; background: #F0F0F0; border-radius: 10px; margin-bottom: 15px; padding: 3px; box-sizing: border-box;}
        .tab-item { flex: 1; text-align: center; font-size: 14px; color: #666; padding: 6px 0; border-radius: 8px; cursor: pointer; }
        .tab-item.active { background: #fff !important; color: #FF69B4 !important; font-weight: bold; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .item-list { display: flex; flex-direction: column; gap: 8px; }
        .item { display: flex; align-items: center; background: #FFF0F5; padding: 10px 15px; border-radius: 10px; border: 1px solid #FFE4E1; cursor: pointer; transition: all 0.1s; }
        .item:active { transform: scale(0.98); }
        .item-icon { font-size: 25px; margin-right: 15px; }
        .item-info { display: flex; flex-direction: column; flex: 1; }
        .item-name { font-size: 15px; font-weight: bold; color: #333; }
        .item-desc { font-size: 12px; color: #F59A23; margin-top: 2px; }
        .equip-text { color: #FF69B4; } .wearing-text { color: #999; }
        .diary-list { display: flex; flex-direction: column; gap: 10px; max-height: 50vh; overflow-y: auto; }
        .diary-card { background: #F8F9FA; padding: 12px; border-radius: 10px; border-left: 4px solid #FFE4E1; }
        .cat-diary { background: #FDF5FF; border-left: 4px solid #C88AFF; }
        .diary-date { font-size: 12px; font-weight: bold; color: #FF69B4; margin-bottom: 5px; display: block; }
        .cat-diary .diary-date { color: #A855F7; }
        .diary-text { font-size: 14px; color: #333; line-height: 1.5; }
        .memo-select-row { display: flex; width: 100%; justify-content: space-between; margin-bottom: 10px; }
        .memo-select-box { display: flex; flex-direction: column; flex: 1; margin: 0 5px; }
        .select-label { font-size: 12px; color: #666; margin-bottom: 5px; font-weight: bold; }
        .emoji-picker { display: flex; justify-content: space-around; background: #F0F0F0; padding: 5px; border-radius: 8px; }
        .emoji-picker span { font-size: 18px; padding: 3px 6px; border-radius: 6px; filter: grayscale(100%); opacity: 0.4; cursor: pointer; transition: all 0.2s; }
        .emoji-picker span.active { filter: grayscale(0%); opacity: 1; transform: scale(1.2); background: #fff; box-shadow: 0 2px 5px rgba(255,105,180,0.3); }
        .memo-input { width: 100%; height: 80px; background: #FFF8E7; border: 1px solid #F5DEB3; border-radius: 8px; padding: 10px; font-size: 14px; box-sizing: border-box; margin-bottom: 10px; color: #555; line-height: 1.5; resize: none; outline: none;}
        .memo-save-btn { width: 100%; background: #FF69B4; color: white; border-radius: 20px; font-size: 15px; padding: 8px 0; border: none; cursor: pointer; }
        .memo-history-title { width: 100%; font-size: 14px; font-weight: bold; color: #FF69B4; margin-top: 15px; margin-bottom: 10px; border-left: 4px solid #FF69B4; padding-left: 8px; }
        .memo-card { background: #fff; border: 1px solid #EEE; border-radius: 10px; padding: 10px; margin-bottom: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.03); }
        .memo-card-header { display: flex; justify-content: space-between; margin-bottom: 6px; }
        .memo-time { font-size: 11px; color: #999; font-weight: bold; } .memo-tags { font-size: 12px; background: #FFF0F5; padding: 2px 8px; border-radius: 10px; }
        .memo-text-content { font-size: 14px; color: #333; line-height: 1.5; margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px dashed #EEE; }
        .letter-box { background: #FFF8E7; padding: 10px; border-radius: 8px; } .letter-header { font-size: 12px; font-weight: bold; color: #F59A23; margin-bottom: 5px; }
        .letter-content { font-size: 13px; color: #555; line-height: 1.6; display: block; text-align: justify; }
        .special-input { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 8px; margin-bottom: 10px; box-sizing: border-box; outline: none; }
        .anniversary-item { display: flex; justify-content: space-between; background: #f5f5f5; padding: 10px; border-radius: 8px; margin-bottom: 8px; align-items: center; }
        .anniversary-info { text-align: left; } .anniversary-title { font-weight: bold; font-size: 14px; } .anniversary-date { font-size: 12px; color: #666; }
        .delete-btn { color: red; font-size: 18px; cursor: pointer; padding: 0 10px; }
        .album-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .album-item { position: relative; width: 100%; aspect-ratio: 1; border-radius: 8px; overflow: hidden; background: #000; }
        .album-img { width: 100%; height: 100%; object-fit: cover; opacity: 0.9; }
        .album-note { position: absolute; bottom: 0; width: 100%; background: rgba(0,0,0,0.5); color: #fff; font-size: 10px; text-align: center; padding: 2px 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
        .album-delete { position: absolute; top: 2px; right: 2px; width: 18px; height: 18px; background: rgba(0,0,0,0.6); color: white; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 12px; z-index: 2; cursor: pointer; }
        .album-add { width: 100%; aspect-ratio: 1; border: 1px dashed #CCC; border-radius: 8px; display: flex; justify-content: center; align-items: center; font-size: 30px; color: #CCC; background: #FAFAFA; cursor: pointer; }
        .event-card { width: 80%; background: #FFF; border-radius: 15px; padding: 35px 20px 20px 20px; display: flex; flex-direction: column; align-items: center; position: relative; animation: popIn 0.4s ease-out; box-shadow: 0 10px 25px rgba(0,0,0,0.3); box-sizing: border-box; text-align: center;}
        .event-badge { position: absolute; top: -12px; background: linear-gradient(90deg, #FF69B4, #FF1493); color: white; padding: 5px 20px; border-radius: 15px; font-size: 14px; font-weight: bold; }
        .event-icon { font-size: 50px; margin: 10px 0; } .event-title { font-size: 18px; font-weight: bold; color: #333; margin-bottom: 10px; } .event-desc { font-size: 14px; color: #666; line-height: 1.6; margin-bottom: 20px; }
        .box-btn { width: 80%; background: #FF69B4; color: white; border-radius: 20px; font-size: 15px; padding: 8px 0; border: none; cursor: pointer; }
    </style>
</head>
<body class="bg-default">
    <div class="container">
      <div class="status-bar">
        <div class="stat-item">❤️ <span id="affection-num">0</span></div>
        <div class="stat-item level-tag" id="level-text">极度防备</div>
        <div class="stat-item">🪙 <span id="coins-num">500</span></div>
      </div>
      <div class="top-tools">
        <div class="tool-btn" onclick="openPanel('memo')">📝 记录</div>
        <div class="tool-btn" onclick="openPanel('album')">📷 相册</div>
        <div class="tool-btn" onclick="openSpecialPanel()">🌸 特殊日子</div>
      </div>
      <div class="character-area">
        <div class="bubble" id="bubble">台词测试</div>
        <div class="float-text" id="float-text">+1</div>
        <div class="char-box">
          <div class="halo-bg"></div>
          <div class="acc acc-back" id="acc-back" style="display: none;"></div>
          <img class="char-img" id="char-img" src="" onclick="hatchEgg()">
          <div class="acc acc-head" id="acc-head" style="display: none;"></div>
          <div class="acc acc-face" id="acc-face" style="display: none;"></div>
          <div class="acc acc-hand" id="acc-hand" style="display: none;"></div>
          
          <div class="hitbox hit-head" onclick="handleTouch('head')"></div>
          <div class="hitbox hit-face" onclick="handleTouch('cheek')"></div>
          <div class="hitbox hit-neck" onclick="handleTouch('neck')"></div>
          <div class="hitbox hit-belly" onclick="handleTouch('belly')"></div>
          <div class="hitbox hit-hand" onclick="handleTouch('hand')"></div>
          <div class="hitbox hit-foot" onclick="handleTouch('foot')"></div>
          <div class="hitbox hit-tail" onclick="handleTouch('tail')"></div>
          <div class="hitbox hit-ear" onclick="handleTouch('ear')"></div>
          <div class="hitbox hit-cheek" onclick="handleTouch('cheek')"></div>
          <div class="hitbox hit-nose" onclick="handleTouch('nose')"></div>
        </div>
        <div class="switch-btn-new" onclick="toggleForm()">切换形态</div>
        <div class="tip-text" id="tip-text">到处摸摸坤坤试试看</div>
      </div>
      <div class="chat-area" id="chat-history"></div>
      <div class="nav-bar">
        <div class="nav-item" onclick="openPanel('backpack')"><span class="nav-icon">🎒</span><span class="nav-label">背包</span></div>
        <div class="nav-item" onclick="openPanel('diary')"><span class="nav-icon">📖</span><span class="nav-label">日记</span></div>
        <div class="nav-item" onclick="openPanel('shop')"><span class="nav-icon">🛍️</span><span class="nav-label">商城</span></div>
      </div>
      <div class="bottom-bar">
        <input class="real-input" type="text" placeholder="和坤坤说点什么..." id="chat-input" onkeypress="handleKeyPress(event)">
        <button class="send-btn" onclick="sendMessage()">发送</button>
      </div>

      <div class="modal-mask" id="modal-mask" style="display: none;" onclick="closePanel()">
        <div class="modal-content" onclick="event.stopPropagation()">
           <div class="modal-title" id="panel-title">标题</div>
           <div id="panel-shop" style="display: none; width:100%;">
             <div class="diary-tabs">
               <div class="tab-item active" onclick="switchShopTab('food')">🍱 美食</div>
               <div class="tab-item" onclick="switchShopTab('flower')">🌸 送花</div>
               <div class="tab-item" onclick="switchShopTab('wear')">👑 穿搭</div>
             </div>
             <div class="item-list" id="shop-list"></div>
           </div>
           <div id="panel-backpack" style="display: none; width:100%;">
             <div class="diary-tabs">
               <div class="tab-item active" onclick="switchBackpackTab('cat')">零食</div>
               <div class="tab-item" onclick="switchBackpackTab('player')">我的物品</div>
             </div>
             <div class="item-list" id="backpack-list"></div>
           </div>
           <div id="panel-diary" style="display: none; width:100%;">
             <div class="diary-tabs">
               <div class="tab-item active" onclick="switchDiaryTab('player')">我的记录</div>
               <div class="tab-item" onclick="switchDiaryTab('cat')">他的独白</div>
             </div>
             <div class="diary-list" id="diary-list"></div>
           </div>
           <div id="panel-memo" style="display: none; width:100%;">
             <div class="memo-select-row">
               <div class="memo-select-box">
                 <span class="select-label">天气</span>
                 <div class="emoji-picker"><span class="active" onclick="pickWeather(this, '☀️')">☀️</span><span onclick="pickWeather(this, '🌧️')">🌧️</span></div>
               </div>
               <div class="memo-select-box">
                 <span class="select-label">心情</span>
                 <div class="emoji-picker"><span class="active" onclick="pickMood(this, '😊')">😊</span><span onclick="pickMood(this, '😭')">😭</span></div>
               </div>
             </div>
             <textarea class="memo-input" id="memo-input-text" placeholder="写下今天干了什么..."></textarea>
             <button class="memo-save-btn" onclick="saveMemo()">保存日程</button>
             <div class="memo-history-title">📅 日程与回信</div>
             <div id="memo-history-list" style="max-height: 30vh; overflow-y:auto;"></div>
           </div>
           <div id="panel-album" style="display: none; width:100%;">
             <div class="diary-tabs"><div class="tab-item active" onclick="switchAlbumTab('all')">全部</div><div class="tab-item" onclick="switchAlbumTab('daily')">日常</div></div>
             <div class="album-grid" id="album-grid-list"></div>
             <input type="file" id="file-input" accept="image/*" style="display: none;" onchange="handleFileUpload(event)">
           </div>
           <div id="panel-special" style="display: none; width:100%;">
             <div class="diary-tabs"><div class="tab-item active" onclick="switchSpecialTab('period')">生理期</div><div class="tab-item" onclick="switchSpecialTab('anniversary')">纪念日</div></div>
             <div id="tab-period">
               <div style="font-size:12px; color:#666; margin-bottom:10px;">每个月几号？(1-31，仅数字)</div>
               <input type="number" class="special-input" id="period-input" placeholder="例如: 15" style="text-align:center; font-size:20px;">
               <button class="memo-save-btn" onclick="savePeriod()">保存</button>
             </div>
             <div id="tab-anniversary" style="display: none;">
               <div style="font-size:12px; color:#666; margin-bottom:5px;">纪念日名称</div>
               <input type="text" class="special-input" id="anniversary-title-input" placeholder="例如: 第一次相遇">
               <div style="font-size:12px; color:#666; margin-bottom:5px;">具体日期 (YYYY-MM-DD)</div>
               <input type="text" class="special-input" id="anniversary-date-input" placeholder="例如: 2026-10-22">
               <button class="memo-save-btn" onclick="saveAnniversary()">添加纪念日</button>
               <div class="memo-history-title" style="margin-top:15px;">已记录的纪念日：</div>
               <div id="anniversary-list-container"></div>
             </div>
           </div>
           <div class="close-btn" onclick="closePanel()">收起</div>
        </div>
      </div>
      <div class="modal-mask" id="daily-event-modal" style="display: none;" onclick="closeEvent()">
        <div class="event-card" onclick="event.stopPropagation()">
          <div class="event-badge">今日事件</div>

                if (sickPool) reply = sickPool.levels[level][Math.floor(Math.random() * sickPool.levels[level].length)]; else reply = "抱歉，身体不舒服的话要好好休息。"; 
                matched = true;
                
                // 触发塞药弹窗
                setTimeout(() => { 
                    document.getElementById('gift-icon').innerText = "💊🩹"; 
                    document.getElementById('gift-text').innerText = "他嘴上没说什么，但还是把药丸和创可贴塞到了你手里。"; 
                    document.getElementById('gift-modal').style.display = 'flex'; 
                    playerGifts.unshift({ id: "med_" + Date.now(), name: "感冒药和创可贴", icon: "💊🩹", desc: "他硬塞给你的。", date: todayStr }); 
                    localStorage.setItem('playerGifts', JSON.stringify(playerGifts)); 
                    addDiary('cat', "笨蛋，居然生病了。看着真让人心烦。"); 
                }, 1500);
            } else {
                // 2. 按优先级遍历词库：从上往下找，谁在 dialogue.js 里排在前面，谁就先被匹配
                for (let i = 0; i < chatDB.length; i++) { 
                    let category = chatDB[i]; 
                    if (!category.keywords || category.keywords.length === 0) continue; 
                    
                    for (let j = 0; j < category.keywords.length; j++) { 
                        if (text.indexOf(category.keywords[j]) > -1) { 
                            reply = category.levels[level][Math.floor(Math.random() * category.levels[level].length)]; 
                            matched = true; 
                            break; // 在当前分类里找到了，跳出内层循环
                        } 
                    } 
                    if (matched) break; // 🚨 核心：如果找到了匹配的分类，立刻跳出外层循环，不再往下找低优先级的词！
                }
            }
            
            // 3. 兜底逻辑：如果全都没匹配上
            if (!matched) { 
                let fallbackPool = chatDB[chatDB.length - 1].levels[level]; 
                reply = fallbackPool[Math.floor(Math.random() * fallbackPool.length)]; 
            }
            
            // 👇 新增：把台词里的 {name} 替换成你真正的名字
            reply = reply.replace(/{name}/g, savedName);
            
            // 4. 展示回复（带打字动画）
            // 1. 先立刻弹出一个带有 typing 样式的提示
            let loadingMsg = document.createElement('div'); 
            loadingMsg.className = 'chat-msg msg-ai typing'; // 添加了 typing 类
            loadingMsg.innerText = "对方正在输入..."; 
            chatArea.appendChild(loadingMsg); 
            chatArea.scrollTop = chatArea.scrollHeight;

            // 2. 延迟 1.5 秒后再显示真正的回复
            setTimeout(() => { 
                // 把“正在输入”的文字，替换成真正的回复，并移除 typing 类
                loadingMsg.className = 'chat-msg msg-ai'; 
                loadingMsg.innerText = reply; 
                
                // 触发其他动作
                let face = level < 2 ? 'angry' : 'normal'; 
                showBubble(reply, face); 
                addAffectionSilently(2); 
                addDiary('player', '聊天：' + text);
                
                chatArea.scrollTop = chatArea.scrollHeight; 
            }, 1500);
        }
        
        function toggleForm() {
            if (!isHatched) { hatchEgg(); return; }
            alert("当前只有一个形态哦~");
        }

        function hatchEgg() {
            if (isHatched) return; 
            eggTapCount++;
            const img = document.getElementById('char-img');
            
            if (eggTapCount < 5) { 
                img.classList.add('shake-animation');
                setTimeout(() => { img.classList.remove('shake-animation'); }, 400);
                // 前4次敲击：正常人的反应
                showBubble([
                    "（里面传来轻微的动静，似乎有人翻了个身）", 
                    "（听到了一声有些闷闷的嘟囔：“谁啊……外面好吵。”）", 
                    "（蛋壳裂开了一条缝，透出了一点光）", 
                    "（里面的动静变大了，好像马上就要出来了）"
                ][eggTapCount - 1]); 
            } else {
                isHatched = true; currentImage = IMAGES.normal; document.getElementById('char-img').src = currentImage;
                document.getElementById('tip-text').innerText = "到处摸摸坤坤试试看";
                // 破壳瞬间：有点懵，带点防备和傲娇，但不夸张
                showBubble("（“咔嚓”一声，蛋壳彻底碎裂。他有些踉跄地跌坐出来，拍了拍身上的灰，抬起头有些防备地看着你）……嘶。是你把我敲醒的？（微微皱眉，打量了一下四周）这到底是个什么地方。", 'normal');
                localStorage.setItem('isHatched', 'true'); localStorage.setItem('currentImage', currentImage);
            }
        }
        
        function openPanel(type) {
            document.getElementById('modal-mask').style.display = 'flex';
            ['shop', 'backpack', 'diary', 'memo', 'album', 'special'].forEach(id => document.getElementById('panel-' + id).style.display = 'none');
            document.getElementById('panel-' + type).style.display = 'block';
            if (type === 'shop') { document.getElementById('panel-title').innerText = "🛍️ 商城"; renderShop(); } 
            else if (type === 'backpack') { document.getElementById('panel-title').innerText = "🎒 背包"; renderBackpack(); } 
            else if (type === 'diary') { document.getElementById('panel-title').innerText = "📖 羁绊日记"; renderDiary('player'); } 
            else if (type === 'memo') { document.getElementById('panel-title').innerText = "📝 今日记录"; renderMemo(); } 
            else if (type === 'album') { document.getElementById('panel-title').innerText = "📷 回忆相册"; renderAlbum(); }
        }
        function openSpecialPanel() { openPanel('special'); document.getElementById('panel-title').innerText = "🌸 特殊日子"; document.getElementById('period-input').value = periodDay; renderAnniversary(); }
        function closePanel() { document.getElementById('modal-mask').style.display = 'none'; }

        let currentShopTab = 'food';
        function switchShopTab(tab) {
            currentShopTab = tab;
            document.querySelectorAll('#panel-shop .tab-item').forEach((el, i) => { if((tab === 'food' && i === 0) || (tab === 'flower' && i === 1) || (tab === 'wear' && i === 2)) el.classList.add('active'); else el.classList.remove('active'); });
            renderShop();
        }
        function renderShop() {
            const listEl = document.getElementById('shop-list'); listEl.innerHTML = '';
            if (currentShopTab === 'food') { foodItems.forEach((item, index) => { listEl.innerHTML += `<div class="item" onclick="buyFood(${index})"><span class="item-icon">${item.icon}</span><div class="item-info"><span class="item-name">${item.name}</span><span class="item-desc">🪙 ${item.price} (好感${item.value > 0 ? '+' : ''}${item.value})</span></div></div>`; }); } 
            else if (currentShopTab === 'flower') { flowerItems.forEach((item, index) => { listEl.innerHTML += `<div class="item" onclick="buyFlower(${index})"><span class="item-icon">${item.icon}</span><div class="item-info"><span class="item-name">${item.name}</span><span class="item-desc" style="color:#666;">${item.desc}</span><span class="item-desc" style="color:#ff69b4;">🪙 ${item.price} (好感+${item.value})</span></div></div>`; }); } 
            else { shopData.forEach((item, index) => { let statusHtml = ''; if (!item.owned) statusHtml = `<span class="item-desc">🪙 ${item.price} 购买</span>`; else if (equipped[item.type] === item.id) statusHtml = `<span class="item-desc wearing-text">脱下</span>`; else statusHtml = `<span class="item-desc equip-text">点击穿戴</span>`; listEl.innerHTML += `<div class="item" onclick="handleShop(${index})"><span class="item-icon">${item.icon}</span><div class="item-info"><span class="item-name">${item.name}</span>${statusHtml}</div></div>`; }); }
        }
        function buyFood(index) {
            if (!isHatched) { hatchEgg(); return; } let food = foodItems[index];
            if (coins >= food.price) { if(confirm(`确定要花费 ${food.price} 金币购买【${food.name}】吗？`)) { coins -= food.price; inventory[food.id] = (inventory[food.id] || 0) + 1; localStorage.setItem('coins', coins); localStorage.setItem('inventory', JSON.stringify(inventory)); document.getElementById('coins-num').innerText = coins; alert('已放入背包'); renderShop(); } } else alert("金币不足哦！");
        }
        function buyFlower(index) {
            if (!isHatched) { hatchEgg(); return; } let flower = flowerItems[index];
            if (coins >= flower.price) { if(confirm(`确定花费 ${flower.price} 金币购买【${flower.name}】送给坤坤吗？`)) { coins -= flower.price; localStorage.setItem('coins', coins); document.getElementById('coins-num').innerText = coins; showBubble(`哼，送我的？……${flower.name}。勉强收下吧，别指望我会说谢谢。`, 'shy'); addAffectionSilently(flower.value); addDiary('player', '送了花朵：' + flower.name); renderShop(); } } else alert("金币不足！");
        }
        function handleShop(index) {
            if (!isHatched) { hatchEgg(); return; } let item = shopData[index];
            if (!item.owned) {
                if (coins >= item.price) { if(confirm(`确定要花费 ${item.price} 金币购买【${item.name}】吗？`)) { coins -= item.price; item.owned = true; equipped[item.type] = item.id; localStorage.setItem('coins', coins); localStorage.setItem('shopData', JSON.stringify(shopData)); localStorage.setItem('equipped', JSON.stringify(equipped)); document.getElementById('coins-num').innerText = coins; updateEquipUI(); renderShop(); } } else alert("金币不足！");
            } else { equipped[item.type] = equipped[item.type] === item.id ? "" : item.id; localStorage.setItem('equipped', JSON.stringify(equipped)); updateEquipUI(); renderShop(); }
        }
        function updateEquipUI() {
            ['head', 'face', 'hand', 'back'].forEach(type => {
                let el = document.getElementById('acc-' + type); let equippedId = equipped[type];
                if (equippedId) { let item = shopData.find(i => i.id === equippedId); if (item) { el.innerText = item.icon; el.style.display = 'block'; return; } }
                el.style.display = 'none';
            });
        }

        let currentBackpackTab = 'cat';
        function switchBackpackTab(tab) {
            currentBackpackTab = tab;
            document.querySelectorAll('#panel-backpack .tab-item').forEach((el, i) => { if((tab === 'cat' && i === 0) || (tab === 'player' && i === 1)) el.classList.add('active'); else el.classList.remove('active'); });
            renderBackpack();
        }
        function renderBackpack() {
            const listEl = document.getElementById('backpack-list'); listEl.innerHTML = ''; let hasItem = false;
            if(currentBackpackTab === 'cat') {
                foodItems.forEach((item, index) => { if (inventory[item.id] > 0) { hasItem = true; listEl.innerHTML += `<div class="item" onclick="feedFood(${index})"><span class="item-icon">${item.icon}</span><div class="item-info"><span class="item-name">${item.name} <span style="color:#F59A23;font-size:12px;margin-left:10px;">x${inventory[item.id]}</span></span><span class="item-desc">点击投喂</span></div></div>`; } });
                if(!hasItem) listEl.innerHTML = `<div style="text-align:center; color:#999; margin-top:20px;">背包空空如也，快去商城买点吃的吧~</div>`;
            } else {
                if(playerGifts.length === 0) { listEl.innerHTML = `<div style="text-align:center; color:#999; margin-top:20px;">好感度提升时会收到他送的礼物哦</div>`; } 
                else { playerGifts.forEach(item => { listEl.innerHTML += `<div class="item"><span class="item-icon">${item.icon}</span><div class="item-info"><div style="display:flex; justify-content: space-between;"><span class="item-name">${item.name}</span><span style="font-size:10px; color:#999; margin-top:4px;">${item.date}</span></div><span class="item-desc" style="color:#ff69b4;">${item.desc}</span></div></div>`; }); }
            }
        }
        function feedFood(index) {
            if (!isHatched) { hatchEgg(); return; } let food = foodItems[index];
            if (inventory[food.id] > 0) {
                inventory[food.id] -= 1; localStorage.setItem('inventory', JSON.stringify(inventory)); closePanel();
                showBubble(food.reply, food.value < 0 ? 'angry' : 'shy'); addDiary('player', '投喂食物：' + food.name);
                let affChange = food.value; addAffectionSilently(affChange);
                let feedCount = parseInt(localStorage.getItem('feedCount')) || 0; feedCount++; localStorage.setItem('feedCount', feedCount);
                if (feedCount % 2 === 0 || affChange < 0) { 
                    addDiary('cat', behaviorDiaryDB[Math.floor(Math.random()*behaviorDiaryDB.length)]); 
                }
            }
        }

        let currentDiaryTab = 'player';
        function switchDiaryTab(tab) {
            currentDiaryTab = tab;
            document.querySelectorAll('#panel-diary .tab-item').forEach((el, i) => { if((tab === 'player' && i === 0) || (tab === 'cat' && i === 1)) el.classList.add('active'); else el.classList.remove('active'); });
            renderDiary(tab);
        }
        function renderDiary(type) {
            const listEl = document.getElementById('diary-list'); listEl.innerHTML = '';
            let list = type === 'player' ? playerDiary : catDiary;
            if (list.length === 0) { listEl.innerHTML = `<div style="text-align:center; color:#999; padding:20px;">还没有日记哦</div>`; return; }
            list.forEach(item => { listEl.innerHTML += `<div class="diary-card ${type === 'cat' ? 'cat-diary' : ''}"><span class="diary-date">${item.date}</span><span class="diary-text">${item.text}</span></div>`; });
        }

        let selectedWeather = '☀️'; let selectedMood = '😊';
        function pickWeather(el, val) { document.querySelectorAll('.emoji-picker')[0].querySelectorAll('span').forEach(span => span.classList.remove('active')); el.classList.add('active'); selectedWeather = val; }
        function pickMood(el, val) { document.querySelectorAll('.emoji-picker')[1].querySelectorAll('span').forEach(span => span.classList.remove('active')); el.classList.add('active'); selectedMood = val; }
        function saveMemo() {
            if (!isHatched) { hatchEgg(); return; } let text = document.getElementById('memo-input-text').value.trim(); if (!text) return alert("写点什么再保存吧~");
            let newRecord = { id: Date.now(), date: todayStr, text: text, weather: selectedWeather, mood: selectedMood, replied: false, reply: "" };
            memoHistory.unshift(newRecord); localStorage.setItem('memoHistory', JSON.stringify(memoHistory)); document.getElementById('memo-input-text').value = '';
            addDiary('player', '记录日程：' + text); renderMemo();
            setTimeout(() => { generateLongReply(0); renderMemo(); }, 1000);
        }
        function generateLongReply(index) {
            let memo = memoHistory[index]; if (!memo || memo.replied) return;
            let level = getLevel(); let text = memo.text;
            
            let chosenReply = "";
            if (level <= 1) {
                chosenReply = "今天居然收到你的长篇大论，还真是稀奇。你说你今天吃了一家很好吃的甜点，还遇到了像小狗一样的云。我一边看一边在想那个画面。今天傍晚的晚霞很好看，粉紫色的，我本来想拍下来，结果手机拿晚了，一下子就没了。你那边如果也有晚霞的话，记得看。你说心情还不错，我也挺高兴的。虽然我们还没到那种无话不谈的地步，但看你碎碎念的样子，我觉得挺安心的。希望你每天都能有这种平淡的开心。如果哪天不开心了，也别藏着，我勉强听你说说吧。";
            } else if (level === 2) {
                chosenReply = "爱坤，看到你写的信了。你这人是不是傻，天气降温了也不知道多穿件衣服？真让人不省心。我在练习室里出了一身汗，本来挺热的，看到你说今天被工作搞得有点烦，我瞬间就觉得这天气也没那么难熬了。……我才没有很担心你，我就是觉得，你要是病了，我还得抽时间照顾你，很麻烦的。你听话一点行不行？如果实在觉得委屈，就深呼吸，或者在心里骂我两句。我在这儿呢，不会走的，你什么时候都能来找我。下次记得带伞，不然我就要生气了，你干嘛～一点都不让人放心。";
            } else if (level === 3) {
                chosenReply = "爱坤，今天一直没看到你上线，结果先看到了你的日记。你说今天有点累，想早点睡。我本来打了一大段话想叫你来陪我，最后又一个字一个字删掉了。你干嘛～每次都让我这么牵肠挂肚。我不管，明天你必须要多陪我才行。今天天气挺阴的，跟我心情差不多。你不在的时候，连空气都安静得有点过分。如果你累了就好好休息，但明天醒来第一件事一定要找我。晚上睡觉盖好被子，别着凉。其实我挺想跟你道晚安的，要是你在就好了。";
            } else {
                chosenReply = "爱坤，今天一睁眼就看到了你的留言。你说你有点迷茫，不知道该往哪走。其实我看着这些字的时候，心里挺难受的。我想告诉你，不管你选什么，我都会支持你。如果选错了也没关系，大不了回来，我养你。我今天这里天气很好，太阳很大，但我没什么心思出门，只想坐在这里给你回信。你不要一个人把所有事都扛着，你可以依赖我。我平时可能不太会说这些肉麻的话，但请你一定要记住。把那些坏心情都扔给我吧，我接得住。我什么都不怕，就怕你难过。好了，去吃点好吃的，乖一点。";
            }
            memoHistory[index].replied = true; memoHistory[index].reply = chosenReply; localStorage.setItem('memoHistory', JSON.stringify(memoHistory)); addDiary('cat', '我给她写了长长的一封信。');
        }
        function renderMemo() {
            const listEl = document.getElementById('memo-history-list'); listEl.innerHTML = '';
            if (memoHistory.length === 0) { listEl.innerHTML = `<div style="text-align:center; color:#999; padding:20px;">还没有记录哦</div>`; return; }
            memoHistory.forEach(item => {
                let letterHtml = item.replied ? `<div class="letter-box"><div class="letter-header">✉️ 坤坤的来信：</div><span class="letter-content">${item.reply}</span></div>` : `<div class="letter-box" style="background:#F8F9FA;"><div class="letter-header">✉️ 尚未收到回信</div><span class="letter-content" style="color:#999;">（他似乎还没看到，等明天再来看吧…）</span></div>`;
                listEl.innerHTML += `<div class="memo-card"><div class="memo-card-header"><span class="memo-time">${item.date}</span><span class="memo-tags">${item.weather} ${item.mood}</span></div><div class="memo-text-content">我的日程：${item.text}</div>${letterHtml}</div>`;
            });
        }

        let currentAlbumTab = 'all';
        function switchAlbumTab(tab) {
            currentAlbumTab = tab;
            document.querySelectorAll('#panel-album .tab-item').forEach((el, i) => { if((tab === 'all' && i === 0) || (tab === 'daily' && i === 1)) el.classList.add('active'); else el.classList.remove('active'); });
            renderAlbum();
        }
        function renderAlbum() {
            const listEl = document.getElementById('album-grid-list'); listEl.innerHTML = '';
            albumList.forEach((item, index) => { if (currentAlbumTab === 'all' || item.category === currentAlbumTab) { listEl.innerHTML += `<div class="album-item"><img class="album-img" src="${item.url}"><div class="album-note">${item.note}</div><div class="album-delete" onclick="deletePhoto(${index}, event)">×</div></div>`; } });
            listEl.innerHTML += `<div class="album-add" onclick="document.getElementById('file-input').click()">+</div>`;
        }
        function handleFileUpload(event) {
            if (!isHatched) { hatchEgg(); return; }
            const file = event.target.files[0]; if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                let base64Img = e.target.result; let note = prompt("写个回忆备注吧", "无备注"); if(note === null) return;
                albumList.push({ url: base64Img, note: note, category: 'daily' });
                try { localStorage.setItem('albumList', JSON.stringify(albumList)); renderAlbum(); } catch(err) { alert("图片太大，本地存储空间不足啦！"); albumList.pop(); }
            };
            reader.readAsDataURL(file); event.target.value = '';
        }
        function deletePhoto(index, event) {
            event.stopPropagation(); if(confirm("确定要删除这张回忆吗？")) { albumList.splice(index, 1); localStorage.setItem('albumList', JSON.stringify(albumList)); renderAlbum(); }
        }

        let currentSpecialTab = 'period';
        function switchSpecialTab(tab) {
            currentSpecialTab = tab;
            document.querySelectorAll('#panel-special .tab-item').forEach((el, i) => { if((tab === 'period' && i === 0) || (tab === 'anniversary' && i === 1)) el.classList.add('active'); else el.classList.remove('active'); });
            if(tab === 'period') { document.getElementById('tab-period').style.display = 'block'; document.getElementById('tab-anniversary').style.display = 'none'; } 
            else { document.getElementById('tab-period').style.display = 'none'; document.getElementById('tab-anniversary').style.display = 'block'; }
        }
        function savePeriod() {
            let day = document.getElementById('period-input').value;
            if(day && parseInt(day) >= 1 && parseInt(day) <= 31) { periodDay = day; localStorage.setItem('periodDay', periodDay); alert("记录成功，他会记住的！"); } else alert("请输入1-31的有效日期哦");
        }
        function saveAnniversary() {
            let title = document.getElementById('anniversary-title-input').value.trim(); let dateStr = document.getElementById('anniversary-date-input').value.trim();
            if(!title || !dateStr) return alert("名称和日期都要填哦");
            let formatStr = dateStr.replace(/\//g, '-'); let parts = formatStr.split('-'); let month, day;
            if (parts.length === 3) { month = parseInt(parts[1]); day = parseInt(parts[2]); } else if (parts.length === 2) { month = parseInt(parts[0]); day = parseInt(parts[1]); }
            if (isNaN(month) || isNaN(day) || month < 1 || month > 12 || day < 1 || day > 31) return alert("日期格式有误，如 10-22");
            let finalDate = (month < 10 ? '0' + month : month) + '-' + (day < 10 ? '0' + day : day);
            anniversaryList.unshift({ id: Date.now(), title: title, date: finalDate }); localStorage.setItem('anniversaryList', JSON.stringify(anniversaryList));
            document.getElementById('anniversary-title-input').value = ''; document.getElementById('anniversary-date-input').value = '';
            renderAnniversary(); alert("纪念日已添加！");
        }
        function renderAnniversary() {
            const listEl = document.getElementById('anniversary-list-container'); listEl.innerHTML = '';
            if(anniversaryList.length === 0) { listEl.innerHTML = `<div style="color:#999; font-size:12px;">暂无</div>`; return; }
            anniversaryList.forEach(item => { listEl.innerHTML += `<div class="anniversary-item"><div class="anniversary-info"><div class="anniversary-title">${item.title}</div><div class="anniversary-date">${item.date}</div></div><div class="delete-btn" onclick="deleteAnniversary(${item.id})">×</div></div>`; });
        }
        function deleteAnniversary(id) { anniversaryList = anniversaryList.filter(item => item.id !== id); localStorage.setItem('anniversaryList', JSON.stringify(anniversaryList)); renderAnniversary(); }

        window.addEventListener('beforeunload', function () { localStorage.setItem('lastExitTime', Date.now()); });
        initUI();
    </script>
